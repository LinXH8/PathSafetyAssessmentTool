server {
  listen 80;
  server_name _;

  # 前端 SPA
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # 反向代理到 Flask 后端
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-running calls (project creation from thousands of frames, bulk
    # autocode, report export) and the autocode SSE stream outlive nginx's
    # 60 s default and otherwise surface as a 504 while the backend keeps
    # working. Survey-image and shapefile-zip uploads exceed the 1 MB default
    # body limit.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 2g;
  }
}
